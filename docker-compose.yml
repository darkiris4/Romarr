services:
  romarr:
    image: ghcr.io/darkiris4/romarr:latest
    # container_name: romarr
    # restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/romarr.db
      - DATA_DIR=/app/data
      # - LOG_LEVEL=INFO
      # - IGDB_CLIENT_ID=
      # - IGDB_CLIENT_SECRET=
    volumes:
      - romarr-data:/app/data
      - ${ROM_LIBRARY_PATH:-./library}:/app/library
    ports:
      - "${ROMARR_PORT:-7878}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/status')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  romarr-data:
