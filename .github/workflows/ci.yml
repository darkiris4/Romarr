name: CI

on:
  push:
    branches: [main, feature/e2e-download-pipeline]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff>=0.4.0

      - name: Lint
        run: ruff check backend/app/

      - name: Format check
        run: ruff format --check backend/app/

  frontend:
    name: Frontend (ESLint + Prettier + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: node_modules/.bin/tsc --noEmit

      - name: Build
        run: npm run build
