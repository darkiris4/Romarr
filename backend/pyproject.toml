[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",   # line too long — handled by formatter
    "UP007",  # use X | Y instead of Optional — FastAPI typing compat
    "UP006",  # use built-in types in annotations — SQLAlchemy compat
    "F821",   # undefined name — false positive on SQLAlchemy forward-reference strings
    "E402",   # module-level import not at top — intentional lazy imports in API layer
    "UP042",  # replace-str-enum — SQLAlchemy enum compat
    "E712",   # comparison to True/False — SQLAlchemy filter compat
]

[tool.ruff.lint.per-file-ignores]
# Lazy in-function imports are intentional throughout the API layer
"app/api/**/*.py" = ["PLC0415"]
"app/main.py" = ["PLC0415"]
"app/services/scheduler.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
